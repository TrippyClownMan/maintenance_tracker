name: "Build Flipper Application"
on: [push, pull_request]

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flipper Application Package
        uses: xMasterX/fbt-action@main
        with:
          app_dir: .
          firmware_channel: release

