name: "Flipper FAP Build"
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build FAP with FlipperFAP Actions
        uses: joelewis012/flipper-fap-actions@main
        with:
          repo_url: https://github.com
          target_firmware: momentum
